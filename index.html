<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>السحب الرسمي — Official Draw</title>
<style>
/* Gotham itself is a licensed font with no Google Fonts distribution, so
   it can't be embedded here. Cairo is the closest available match: a
   geometric sans with the same even, modern letterforms as Gotham, and
   (unlike Gotham) native Arabic glyphs — one family instead of pairing
   two fonts with a fallback gap. */
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&display=swap');

:root{
  --bg:#FDFCFA;
  --surface:#FFFFFF;
  --line:#EDE8DD;
  --text:#191D3A;
  --muted:#8B8378;
  --brass:#C3A966;
  --brass-bright:#E4CD94;
  --brass-dim:#A9863F;
  --on-gold:#191D3A;
  --ui:"Cairo","Segoe UI",system-ui,sans-serif;
  --formal:"Cairo","Segoe UI",system-ui,sans-serif;
  --reelRowH:clamp(64px,12vh,140px);
  --radius:10px;
  --pill:999px;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg) url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 140'><path d='M25,120 L25,55 A25,25 0 0 1 75,55 L75,120' fill='none' stroke='rgba(169,134,63,0.14)' stroke-width='2.2' stroke-linecap='round'/><line x1='18' y1='120' x2='82' y2='120' stroke='rgba(169,134,63,0.14)' stroke-width='2.2' stroke-linecap='round'/><line x1='34' y1='120' x2='34' y2='129' stroke='rgba(169,134,63,0.14)' stroke-width='2' stroke-linecap='round'/><line x1='50' y1='120' x2='50' y2='129' stroke='rgba(169,134,63,0.14)' stroke-width='2' stroke-linecap='round'/><line x1='66' y1='120' x2='66' y2='129' stroke='rgba(169,134,63,0.14)' stroke-width='2' stroke-linecap='round'/><line x1='15' y1='130' x2='85' y2='130' stroke='rgba(169,134,63,0.14)' stroke-width='2.2' stroke-linecap='round'/></svg>") repeat-x bottom / 110px 154px fixed;
  color:var(--text);
  font-family:var(--ui);
  font-weight:300;
  -webkit-font-smoothing:antialiased;
}
.topBrandBar{position:fixed;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--brass-dim),var(--brass-bright),var(--brass) 60%,var(--brass-dim));z-index:5}

/* Stage runs Saudi National Day 96 ("عزّنا بطبعنا") green-and-gold; the
   gold accent and arch mark carry over from the setup screen so both
   feel like one system. */
/* Stage intentionally carries the same tokens as setup — one Shorofat
   Park identity throughout, not a separate palette. */

/* ============ SETUP ============ */
.setup{max-width:680px;margin:0 auto;padding:48px 28px 96px}

.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:40px}
.wordmark svg{display:block}
.langtoggle{display:flex;gap:2px;border:1px solid var(--line);border-radius:var(--pill);overflow:hidden}
.langtoggle button{
  background:none;border:0;color:var(--muted);font-family:var(--ui);font-size:12px;
  padding:6px 13px;cursor:pointer;font-weight:400;transition:background .15s ease,color .15s ease;
}
.langtoggle button:hover{background:var(--bg);color:var(--text)}
.langtoggle button[aria-pressed="true"]{background:var(--surface);color:var(--text)}

.field{margin-bottom:32px}
.field > label,.blockhead{
  display:block;font-size:13px;color:var(--muted);margin-bottom:9px;font-weight:400;
}
.blockhead{display:flex;justify-content:space-between;align-items:baseline}
.count{color:var(--brass);font-variant-numeric:tabular-nums;font-size:13px}
.count.warn{color:#C87B5A}

input[type=text],textarea{
  width:100%;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);color:var(--text);font-family:var(--ui);font-size:15px;
  font-weight:300;padding:11px 13px;
}
textarea{min-height:180px;resize:vertical;line-height:1.85;font-size:14px}
input:focus-visible,textarea:focus-visible,button:focus-visible{
  outline:2px solid var(--brass);outline-offset:2px;
}
::placeholder{color:var(--muted)}

.srctabs{display:flex;gap:2px;margin-bottom:12px;border:1px solid var(--line);border-radius:var(--pill);width:fit-content;overflow:hidden}
.srctabs button{background:none;border:0;color:var(--muted);font-family:var(--ui);font-size:12.5px;padding:7px 16px;cursor:pointer;font-weight:400;transition:background .15s ease,color .15s ease}
.srctabs button:hover{background:var(--bg);color:var(--text)}
.srctabs button[aria-pressed="true"]{background:var(--surface);color:var(--text)}
.sheetbox{display:none;margin-bottom:14px}
.sheetbox.on{display:block}
.sheetrow{display:flex;gap:8px}
.sheetrow input{flex:1;font-size:13px;direction:ltr;text-align:left}
.sheetrow button{
  background:var(--surface);border:1px solid var(--line);color:var(--text);
  font-family:var(--ui);font-size:13px;padding:0 20px;border-radius:var(--pill);cursor:pointer;flex:none;
}
.sheetrow button:hover{border-color:var(--brass-dim)}
.synced{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--muted);margin-top:11px;min-height:20px;flex-wrap:wrap}
.dot{width:6px;height:6px;border-radius:50%;background:#D3C7AA;flex:none}
.dot.live{background:#7FB08A;animation:pulse 2s infinite}
.dot.err{background:#C87B5A}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
.helpsteps{font-size:12px;color:var(--muted);line-height:1.85;margin-top:12px;display:none;max-width:62ch}
.helpsteps.on{display:block}
.errmsg{font-size:12.5px;color:#C87B5A;line-height:1.7;margin-top:8px;display:none;max-width:62ch}
.errmsg.on{display:block}
.dropzone{display:none}
.dropzone.on{
  border:1px dashed var(--line);border-radius:var(--radius);padding:16px;margin-top:10px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  font-size:13px;color:var(--muted);cursor:pointer;
}
.dropzone.drag{border-color:var(--brass);background:var(--surface)}
.dropzone button{
  background:none;border:1px solid var(--line);color:var(--text);font-family:var(--ui);
  font-size:12.5px;padding:6px 14px;border-radius:var(--pill);cursor:pointer;flex:none;
}
.dropzone button:hover{border-color:var(--brass-dim)}

.opts{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:14px;align-items:center}
.opt{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer}
.opt input{accent-color:var(--brass);width:15px;height:15px;cursor:pointer}

.prizes{display:flex;flex-direction:column;gap:10px}
.prize{display:flex;gap:10px;align-items:center}
.prize .ord{font-family:var(--formal);color:var(--brass-dim);font-size:15px;width:22px;text-align:center;flex:none}
.prize input{flex:1}

.start{
  display:block;width:100%;border:0;border-radius:var(--pill);color:var(--on-gold);
  font-family:var(--ui);font-weight:500;font-size:15px;padding:15px;cursor:pointer;margin-top:8px;
  text-align:center;background:var(--brass);
  transition:background .15s ease, transform .15s ease, box-shadow .15s ease;
}
.start:hover:not(:disabled){background:var(--brass-dim);transform:translateY(-2px);box-shadow:0 8px 18px rgba(169,134,63,.3)}
.start:active:not(:disabled){transform:translateY(0);box-shadow:none}
.start:disabled{background:var(--surface);color:var(--muted);cursor:not-allowed}

/* ============ STAGE ============ */
.stage{
  display:none;position:fixed;inset:0;
  background:radial-gradient(ellipse 80% 65% at 50% 42%, #FFFFFF 0%, var(--bg) 60%, #F3F1EC 100%);
  flex-direction:column;align-items:center;justify-content:space-between;
  padding:24px 28px;text-align:center;overflow-y:auto;overflow-x:hidden;
}
.stage.on{display:flex}

.stage-head{width:100%;max-width:900px;flex:none}
.event-name{font-family:var(--formal);font-size:clamp(16px,2.2vw,24px);color:var(--text);line-height:1.5}
.stage-head .rule{
  height:1px;background:linear-gradient(90deg,transparent,var(--brass) 50%,transparent);
  margin:18px auto 0;max-width:260px;position:relative;
}
.stage-head .rule::after{
  content:"";position:absolute;top:50%;left:50%;
  width:7px;height:7px;background:var(--brass);
  transform:translate(-50%,-50%) rotate(45deg);
}

.reveal{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  width:100%;gap:14px;min-height:0;
}
.prize-label{
  display:inline-block;position:relative;
  font-size:clamp(12.5px,1.6vw,14.5px);color:var(--brass-dim);font-weight:600;
  letter-spacing:.02em;opacity:0;transition:opacity .5s;flex:none;
  background:var(--surface);border:1px solid var(--brass);
  padding:7px 25px;border-radius:var(--pill);margin-bottom:6px;
  box-shadow:0 3px 10px rgba(0,0,0,.05);
}
.prize-label.show{opacity:1}

/* ---------- name reel ---------- */
/* Fixed size via a plain formula, not flex-grow/shrink — a flex-resized
   box here reproduced two different distortions in testing (flex-shrink
   squashing it short, flex-grow stretching it tall) depending on how much
   sibling content was around it. A fixed height sidesteps the whole class
   of bug: worst case on an unusually short viewport is clipping (visible,
   obviously wrong, fixable by using fullscreen), never silent distortion. */
.reelStage{
  position:relative;display:flex;align-items:center;justify-content:center;
  gap:16px;width:100%;flex:0 0 auto;
}
.reelGlow{
  position:absolute;inset:-16% -6%;border-radius:50%;z-index:0;pointer-events:none;
  background:radial-gradient(circle, rgba(228,205,148,.32) 0%, rgba(228,205,148,.09) 45%, transparent 70%);
  opacity:0;transition:opacity .8s ease;
}
.reelGlow::before{
  content:"";position:absolute;inset:20%;border-radius:50%;
  border:1px solid rgba(195,169,102,.5);
  animation:none;
}
.reelStage:has(.settled) .reelGlow{opacity:1}
.reelStage:has(.settled) .reelGlow::before{animation:ringPulse 1.8s ease-out 2}
@keyframes ringPulse{
  0%{inset:38%;opacity:1;border-width:2px}
  100%{inset:-8%;opacity:0;border-width:1px}
}
.reelViewport{
  position:relative;flex:1 1 auto;min-width:0;max-width:900px;height:min(64vh,640px);
  overflow:hidden;border-radius:var(--radius);border:2px solid var(--brass);z-index:1;
  background:var(--surface);
  box-shadow:
    0 0 0 5px var(--bg),
    0 14px 34px rgba(0,0,0,.08),
    0 4px 12px rgba(0,0,0,.06);
}
.reelViewport::before,.reelViewport::after{
  content:"";position:absolute;left:50%;transform:translateX(-50%) rotate(45deg);
  width:9px;height:9px;background:var(--brass);
  box-shadow:0 0 0 3px var(--bg);z-index:4;
}
.reelViewport::before{top:-12px}
.reelViewport::after{bottom:-12px}
.reelStrip{position:absolute;top:0;left:0;width:100%;will-change:transform}
.reelRow{
  height:var(--reelRowH);display:flex;align-items:center;justify-content:center;
  font-family:var(--formal);font-weight:400;color:var(--text);
  font-size:clamp(28px,6vw,64px);white-space:nowrap;padding:0 5vw;
}
.reelRow.long{font-size:clamp(20px,4.2vw,44px)}
.reelRow:nth-child(odd){background:var(--surface)}
.reelRow:nth-child(even){background:var(--bg)}
.reelRow.winnerRow{
  position:relative;z-index:1;
  transition:transform .5s cubic-bezier(.2,.7,.3,1), color .5s ease;
}
.reelRow.winnerRow.settled{
  transform:scale(1.1);
  color:var(--on-gold);
}
.reelHighlight{
  position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
  height:var(--reelRowH);
  border-top:2px solid var(--brass);border-bottom:2px solid var(--brass);
  pointer-events:none;z-index:2;
}
.reelFade{position:absolute;left:0;right:0;height:32%;pointer-events:none;z-index:3}
.reelFade.top{top:0;background:linear-gradient(to bottom, var(--surface) 0%, rgba(255,255,255,.4) 55%, transparent 100%)}
.reelFade.bottom{bottom:0;background:linear-gradient(to top, var(--bg) 0%, rgba(253,252,250,.4) 55%, transparent 100%)}

.stage-foot{width:100%;max-width:1000px;display:flex;flex-direction:column;gap:16px;flex:none}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.ctl{
  background:none;border:1px solid var(--line);color:var(--text);
  font-family:var(--ui);font-size:14px;font-weight:400;padding:11px 24px;
  border-radius:var(--pill);cursor:pointer;
  transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
}
.ctl:hover:not(:disabled){border-color:var(--brass-dim);transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,.06)}
.ctl:active:not(:disabled){transform:translateY(0);box-shadow:none}
.ctl.primary{
  border-color:var(--brass);color:var(--on-gold);font-weight:500;background:var(--brass);
}
.ctl.primary:hover:not(:disabled){background:var(--brass-dim);transform:translateY(-2px);box-shadow:0 8px 18px rgba(169,134,63,.3)}
.ctl.primary:active:not(:disabled){transform:translateY(0);box-shadow:none}
.ctl:disabled{opacity:.35;cursor:not-allowed}

/* ============ RESULTS ============ */
.results{
  display:none;width:100%;max-width:560px;margin:0 auto;text-align:center;
  background:var(--surface);border:1px solid var(--line);border-radius:8px;
  padding:30px 30px 24px;box-shadow:0 18px 44px rgba(169,134,63,.14), 0 4px 12px rgba(0,0,0,.05);
}
.results.on{display:block}
.res-seal{margin-bottom:6px}
.res-seal svg{filter:drop-shadow(0 2px 3px rgba(169,134,63,.3))}
.res-list{text-align:start}
.res-row{display:flex;gap:16px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--line)}
.res-row:first-child{border-top:1px solid var(--line)}
.res-prize{font-size:13px;color:var(--brass-dim);flex:none;min-width:120px}
.res-name{font-family:var(--formal);font-size:19px;color:var(--text)}
.res-meta{font-size:12px;color:var(--muted);margin-top:14px;font-variant-numeric:tabular-nums;text-align:center}

@media(max-width:560px){
  .setup{padding:32px 20px 72px}
  .res-row{flex-direction:column;gap:4px}
  .reelViewport{height:min(52vh,440px)}
}

@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.15s !important}
  .reelStrip{transition:none !important}
}

</style>
</head>
<body>

<div class="topBrandBar" aria-hidden="true"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E4CD94"/>
      <stop offset="1" stop-color="#A9863F"/>
    </linearGradient>
    <!-- Shorofat Park's mark is a hand-drawn balcony arch; this is an
         original, simplified line-art rendition of that same motif. -->
    <symbol id="archIcon" viewBox="0 0 40 46">
      <path d="M13,31 L13,15 A7,7 0 0 1 27,15 L27,31" fill="none" stroke="url(#goldGrad)" stroke-width="2.4" stroke-linecap="round"/>
      <line x1="9" y1="31" x2="31" y2="31" stroke="url(#goldGrad)" stroke-width="2.4" stroke-linecap="round"/>
      <line x1="16" y1="31.5" x2="16" y2="37" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
      <line x1="20" y1="31.5" x2="20" y2="37" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
      <line x1="24" y1="31.5" x2="24" y2="37" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
      <line x1="8" y1="38" x2="32" y2="38" stroke="url(#goldGrad)" stroke-width="2.4" stroke-linecap="round"/>
    </symbol>
  </defs>
</svg>

<!-- ===================== SETUP ===================== -->
<main class="setup" id="setup">
  <div class="topbar">
    <div class="wordmark">
      <svg width="34" height="39" viewBox="0 0 40 46" aria-hidden="true"><use href="#archIcon"/></svg>
    </div>
    <div class="langtoggle" role="group">
      <button id="btnAr" aria-pressed="true">عربي</button>
      <button id="btnEn" aria-pressed="false">EN</button>
    </div>
  </div>

  <div class="field">
    <label for="eventName" data-ar="اسم المناسبة" data-en="Event name">اسم المناسبة</label>
    <input type="text" id="eventName" data-ar-ph="مثال: سحب شُرفات بارك ٢٠٢٦" data-en-ph="e.g. Shorofat Park Draw 2026" placeholder="مثال: سحب شُرفات بارك ٢٠٢٦">
  </div>

  <div class="field">
    <div class="blockhead">
      <label for="entrants" data-ar="قائمة المشاركين" data-en="Entrant list">قائمة المشاركين</label>
      <span class="count" id="count">0</span>
    </div>

    <div class="srctabs" role="group">
      <button id="tabSheet" aria-pressed="true" data-ar="ربط Google Sheet" data-en="Link Google Sheet">ربط Google Sheet</button>
      <button id="tabPaste" aria-pressed="false" data-ar="لصق يدوي" data-en="Paste">لصق يدوي</button>
    </div>

    <div class="sheetbox on" id="sheetbox">
      <div class="sheetrow">
        <input type="text" id="sheetUrl" value="https://docs.google.com/spreadsheets/d/e/2PACX-1vQPVi__O3qNUkf4W_q43D6yaogCg0Q6j-WOf1kjfSR1OSzKlFkp6-pgjWR2dKZiJ8xqcQ3hx4X5cTXv/pub?gid=0&single=true&output=csv" placeholder="https://docs.google.com/spreadsheets/d/e/.../pub?output=csv">
        <button id="connectBtn" data-ar="اتصال" data-en="Connect">اتصال</button>
      </div>
      <div class="synced">
        <span class="dot" id="syncDot"></span>
        <span id="syncMsg"></span>
      </div>
      <div class="errmsg" id="errmsg"></div>
      <label class="opt" style="margin-top:8px">
        <input type="checkbox" id="hasHeader" checked>
        <span data-ar="السطر الأول عناوين أعمدة" data-en="First row is column headers">السطر الأول عناوين أعمدة</span>
      </label>
      <div class="helpsteps" id="helpsteps"></div>
    </div>

    <textarea id="entrants" data-ar-ph="الصق الأسماء، اسم في كل سطر" data-en-ph="Paste names, one per line" placeholder="الصق الأسماء، اسم في كل سطر" readonly></textarea>
    <div class="dropzone" id="dropzone" tabindex="0" role="button" data-ar="اسحب ملف CSV هنا أو اضغط للاختيار" data-en="Drop a CSV file here, or click to choose">
      <span data-ar="اسحب ملف CSV هنا أو اضغط للاختيار" data-en="Drop a CSV file here, or click to choose">اسحب ملف CSV هنا أو اضغط للاختيار</span>
      <button type="button" id="pickFile" data-ar="اختيار ملف" data-en="Choose file">اختيار ملف</button>
      <input type="file" id="fileInput" accept=".csv,text/csv" style="display:none">
    </div>
    <div class="opts">
      <label class="opt"><input type="checkbox" id="dedupe" checked><span data-ar="حذف المكرر" data-en="Remove duplicates">حذف المكرر</span></label>
    </div>
  </div>

  <div class="field">
    <label data-ar="الجوائز" data-en="Prizes">الجوائز</label>
    <div class="prizes" id="prizes"></div>
  </div>

  <button class="start" id="startDraw" disabled data-ar="ابدأ السحب" data-en="Start draw">ابدأ السحب</button>
</main>

<!-- ===================== STAGE ===================== -->
<section class="stage" id="stage" aria-live="polite">
  <div class="stage-head">
    <div class="event-name" id="stageEvent"></div>
    <div class="rule"></div>
  </div>

  <div class="reveal">
    <div class="prize-label" id="prizeLabel"></div>

    <div class="reelStage">
      <div class="reelGlow" aria-hidden="true"></div>
      <div class="reelViewport" id="reelViewport">
        <div class="reelFade top" aria-hidden="true"></div>
        <div class="reelHighlight" aria-hidden="true"></div>
        <div class="reelStrip" id="reelStrip"></div>
        <div class="reelFade bottom" aria-hidden="true"></div>
      </div>
    </div>

    <div class="results" id="results"></div>
  </div>

  <div class="stage-foot">
    <div class="controls">
      <button class="ctl primary" id="drawBtn"></button>
    </div>
  </div>
</section>

<script>
(function(){
"use strict";

/* ---------- state ---------- */
var lang = "ar";
var pool = [];
var allEntries = [];
var winners = [];
var prizes = [];
var drawIndex = 0;
var busy = false;
var drawnAt = null;

var T = {
  ar:{ startDraw:"ابدأ السحب", drawing:"جارٍ السحب…", next:"السحب التالي", done:"اكتمل السحب",
       entries:"مشارك", dupWarn:"مكرر", ordinal:"الجائزة",
       syncIdle:"غير متصل", syncing:"جارٍ الاتصال…",
       syncLive:"متصل — يتحدّث تلقائياً كل ١٠ ثوانٍ · آخر تحديث ",
       syncNames:" اسم",
       help:"في Google Sheet: أنشئ تبويباً جديداً يحتوي فقط على عمود الأسماء (مثلاً بمعادلة =QUERY) ثم: ملف ← مشاركة ← نشر على الويب ← اختر ذلك التبويب فقط ← الصيغة: قيم مفصولة بفواصل (.csv) ← نشر. لا تنشر التبويب الذي يحتوي على أرقام الهواتف. انسخ رابط النشر والصقه هنا.",
       errNetwork:"تعذّر الوصول إلى الرابط. الأسباب المحتملة: انقطع الاتصال بالإنترنت، أو أن الشيت لم يُنشر على الويب بعد (يمنع المتصفح القراءة من رابط غير منشور - CORS). راجع خطوات النشر أدناه.",
       errHtml:"هذا رابط صفحة الشيت العادية، وليس رابط النشر بصيغة CSV. اذهب إلى ملف ← مشاركة ← نشر على الويب واستخدم الرابط الذي ينتهي بـ output=csv.",
       errHttp:"الرابط أعاد خطأ (قد يكون محذوفاً أو غير مكتمل). انسخه مجدداً من نافذة النشر." },
  en:{ startDraw:"Start draw", drawing:"Drawing…", next:"Next draw", done:"Draw complete",
       entries:"entries", dupWarn:"duplicates", ordinal:"Prize",
       syncIdle:"Not connected", syncing:"Connecting…",
       syncLive:"Live — refreshing every 10s · last update ",
       syncNames:" names",
       help:"In Google Sheets: create a new tab containing only the display column (e.g. with =QUERY), then File → Share → Publish to web → select that tab only → format: Comma-separated values (.csv) → Publish. Never publish the tab holding phone numbers. Copy that link and paste it here.",
       errNetwork:"Could not reach that link. Likely causes: the internet connection dropped, or the sheet hasn't been published to the web yet (the browser blocks reads from an unpublished link — CORS). Check the publish steps below.",
       errHtml:"That's the normal sheet link, not a published CSV link. Go to File → Share → Publish to web and use the link that ends in output=csv.",
       errHttp:"That link returned an error (it may be deleted or incomplete). Copy it again from the publish dialog." }
};

var $ = function(id){ return document.getElementById(id); };
var REEL_ROWS = 40;
var PRIZE_COUNT = 10;
var ORDINAL_WORDS = {
  ar: ["الأولى","الثانية","الثالثة","الرابعة","الخامسة","السادسة","السابعة","الثامنة","التاسعة","العاشرة"],
  en: ["First","Second","Third","Fourth","Fifth","Sixth","Seventh","Eighth","Ninth","Tenth"]
};
var ARABIC_DIGITS = ["٠","١","٢","٣","٤","٥","٦","٧","٨","٩","١٠"];

function renderPrizeFields(){
  var box = $("prizes");
  box.innerHTML = "";
  for(var i=0;i<PRIZE_COUNT;i++){
    var row = document.createElement("div"); row.className = "prize";
    var ord = document.createElement("span"); ord.className = "ord";
    ord.textContent = ARABIC_DIGITS[i+1] || String(i+1);
    var input = document.createElement("input");
    input.type = "text"; input.id = "prize" + (i+1);
    input.value = (lang==="ar" ? "الجائزة " + ORDINAL_WORDS.ar[i] : ORDINAL_WORDS.en[i] + " prize");
    row.appendChild(ord); row.appendChild(input);
    box.appendChild(row);
  }
}

/* ---------- unbiased random (rejection sampling, no modulo bias) ---------- */
function randInt(max){
  if(max<=0) return 0;
  if(!(window.crypto && window.crypto.getRandomValues)) return Math.floor(Math.random()*max);
  var limit = Math.floor(4294967296/max)*max, buf = new Uint32Array(1), v;
  do{ window.crypto.getRandomValues(buf); v = buf[0]; } while(v>=limit);
  return v % max;
}
function shuffle(arr){
  for(var i=arr.length-1;i>0;i--){
    var j = randInt(i+1);
    var t = arr[i]; arr[i]=arr[j]; arr[j]=t;
  }
  return arr;
}
/* pick k random elements from arr without shuffling the whole thing —
   matters once the entrant list runs into the thousands and we only
   ever need a few dozen of them for the reel. */
function sampleK(arr, k){
  var n = arr.length;
  k = Math.min(k, n);
  var a = arr.slice();
  for(var i=0;i<k;i++){
    var j = i + randInt(n-i);
    var t = a[i]; a[i]=a[j]; a[j]=t;
  }
  a.length = k;
  return a;
}

/* ---------- delimiter-aware, quote-aware parsing (never naive split(',')) ---------- */
function detectDelim(raw){
  var sample = raw.split(/\r?\n/).slice(0,20).join("\n");
  return sample.indexOf("\t") !== -1 ? "\t" : ",";
}
function splitRow(line, delim){
  var out = [], cur = "", q = false;
  for(var i=0;i<line.length;i++){
    var ch = line[i];
    if(q){
      if(ch === '"'){ if(line[i+1] === '"'){ cur += '"'; i++; } else q = false; }
      else cur += ch;
    } else {
      if(ch === '"') q = true;
      else if(ch === delim){ out.push(cur); cur = ""; }
      else cur += ch;
    }
  }
  out.push(cur);
  return out;
}
var HEADER_WORDS = ["name","names","full name","full_name","fullname","entrant","entrants",
  "اسم","الاسم","الاسم الكامل","اسم المشارك"];
function looksLikeHeader(cell){
  var v = String(cell||"").trim().toLowerCase();
  return HEADER_WORDS.indexOf(v) !== -1;
}
/* Reads a dropped/chosen CSV file: quote-aware parse, first column, skip
   a header row only if it actually looks like one. */
function parseCsvFile(text){
  var delim = detectDelim(text);
  var lines = text.split(/\r?\n/).filter(function(l){ return l.trim() !== ""; });
  if(!lines.length) return [];
  var rows = lines.map(function(l){ return splitRow(l, delim); });
  var start = looksLikeHeader(rows[0][0]) ? 1 : 0;
  return rows.slice(start).map(function(r){ return (r[0]||"").trim(); }).filter(Boolean);
}
/* Full CSV parser for a fetched published-sheet CSV (quote-aware, handles
   embedded newlines inside quoted cells — splitRow alone isn't enough
   since it works one already-split line at a time). */
function parseSheetCSV(text){
  var rows = [], row = [], cur = "", q = false;
  for(var i=0;i<text.length;i++){
    var ch = text[i];
    if(q){
      if(ch === '"'){ if(text[i+1] === '"'){ cur += '"'; i++; } else q = false; }
      else cur += ch;
    } else {
      if(ch === '"') q = true;
      else if(ch === ","){ row.push(cur); cur = ""; }
      else if(ch === "\n"){ row.push(cur); rows.push(row); row = []; cur = ""; }
      else if(ch !== "\r") cur += ch;
    }
  }
  row.push(cur); rows.push(row);
  return rows.filter(function(r){ return r.some(function(c){ return c.trim() !== ""; }); });
}

/* ---------- Google Sheet live sync ---------- */
var pollTimer = null, srcMode = "sheet";

function setSync(state, msg){
  $("syncDot").className = "dot" + (state ? " " + state : "");
  $("syncMsg").textContent = msg;
}
function setErr(msg){
  var el = $("errmsg");
  if(msg){ el.textContent = msg; el.classList.add("on"); }
  else { el.textContent = ""; el.classList.remove("on"); }
}
function timeStr(d){
  return d.toLocaleTimeString(lang==="ar" ? "ar-SA" : "en-GB", {hour:"2-digit", minute:"2-digit", second:"2-digit"});
}

function pullSheet(silent){
  var url = $("sheetUrl").value.trim();
  if(!url) return;
  if(!silent){ setSync("", T[lang].syncing); setErr(null); }
  fetch(url, {cache:"no-store"})
    .then(function(r){
      if(!r.ok){ var e = new Error("http"); e.kind = "http"; throw e; }
      return r.text();
    })
    .then(function(txt){
      if(/^\s*</.test(txt)){ var e = new Error("html"); e.kind = "html"; throw e; }
      var rows = parseSheetCSV(txt);
      if($("hasHeader").checked && rows.length) rows = rows.slice(1);
      $("entrants").value = rows.map(function(r){ return (r[0]||"").trim(); }).filter(Boolean).join("\n");
      refresh();
      setSync("live", T[lang].syncLive + timeStr(new Date()) + " · " + parseEntries().list.length + T[lang].syncNames);
      setErr(null);
      $("helpsteps").classList.remove("on");
    })
    .catch(function(err){
      var kind = (err && err.kind) || "network";
      var msg = kind==="html" ? T[lang].errHtml : kind==="http" ? T[lang].errHttp : T[lang].errNetwork;
      setSync("err", lang==="ar" ? "تعذّر التحديث" : "Update failed");
      setErr(msg);
      $("helpsteps").classList.add("on");
    });
}
function connectSheet(){
  if(pollTimer) clearInterval(pollTimer);
  pullSheet(false);
  pollTimer = setInterval(function(){ pullSheet(true); }, 10000);
}
function setSource(mode){
  srcMode = mode;
  $("tabSheet").setAttribute("aria-pressed", String(mode === "sheet"));
  $("tabPaste").setAttribute("aria-pressed", String(mode === "paste"));
  $("sheetbox").classList.toggle("on", mode === "sheet");
  $("dropzone").classList.toggle("on", mode === "paste");
  if(mode === "sheet"){
    $("entrants").readOnly = true;
    connectSheet();
  } else {
    if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
    $("entrants").readOnly = false;
    setSync("", T[lang].syncIdle);
    setErr(null);
  }
}

/* ---------- entrant parsing (paste box): dedupe, count ---------- */
function parseEntries(){
  var raw = $("entrants").value;
  var delim = detectDelim(raw);
  var lines = raw.split(/\r?\n/), out = [], dupCount = 0;
  var seen = Object.create(null); // never a plain {} — a name like "constructor"
                                   // or "__proto__" would collide with the
                                   // prototype chain and be mishandled
  for(var i=0;i<lines.length;i++){
    var line = lines[i].trim();
    if(!line) continue;
    var val = splitRow(line, delim)[0].trim();
    if(!val) continue;
    var key = val.replace(/\s+/g," ").toLowerCase();
    if(seen[key]){
      dupCount++;
      if($("dedupe").checked) continue;
    } else { seen[key] = 1; }
    out.push(val);
  }
  return { list: out, dupes: dupCount };
}

function refresh(){
  var r = parseEntries();
  var cEl = $("count");
  cEl.textContent = r.list.length + " " + T[lang].entries + (r.dupes ? " · " + r.dupes + " " + T[lang].dupWarn : "");
  cEl.className = "count" + (r.dupes ? " warn" : "");
  $("startDraw").disabled = r.list.length < 2;
}

/* ---------- CSV file drop / picker ---------- */
function ingestFile(file){
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    var names = parseCsvFile(String(reader.result || ""));
    if(!names.length) return;
    var existing = $("entrants").value.trim();
    $("entrants").value = existing ? existing + "\n" + names.join("\n") : names.join("\n");
    refresh();
  };
  reader.readAsText(file);
}

/* ---------- language ---------- */
function setLang(l){
  lang = l;
  document.documentElement.lang = l;
  document.documentElement.dir = (l === "ar" ? "rtl" : "ltr");
  $("btnAr").setAttribute("aria-pressed", String(l==="ar"));
  $("btnEn").setAttribute("aria-pressed", String(l==="en"));
  document.title = (l==="ar" ? "السحب الرسمي" : "Official Draw");

  var nodes = document.querySelectorAll("[data-ar]");
  for(var i=0;i<nodes.length;i++) nodes[i].textContent = nodes[i].getAttribute("data-"+l);
  var phs = document.querySelectorAll("[data-ar-ph]");
  for(var j=0;j<phs.length;j++) phs[j].placeholder = phs[j].getAttribute("data-"+l+"-ph");
  $("helpsteps").textContent = T[lang].help;

  refresh();
}

/* ---------- stage ---------- */
function updateDrawBtn(){
  var b = $("drawBtn");
  if(busy){ b.textContent = T[lang].drawing; b.disabled = true; return; }
  if(drawIndex >= prizes.length || pool.length === 0){ b.textContent = T[lang].done; b.disabled = true; return; }
  b.disabled = false;
  b.textContent = (drawIndex === 0 ? T[lang].startDraw : T[lang].next);
}

function renderResults(){
  var box = $("results");
  var finished = drawIndex >= prizes.length || pool.length === 0;
  if(!finished || !winners.length){ box.classList.remove("on"); box.innerHTML=""; return; }
  var t = drawnAt ? drawnAt.toLocaleString(lang==="ar" ? "ar-SA" : "en-GB", {dateStyle:"medium", timeStyle:"short"}) : "";
  box.innerHTML =
    '<div class="res-seal"><svg width="34" height="39" viewBox="0 0 40 46" aria-hidden="true"><use href="#archIcon"/></svg></div>' +
    '<div class="res-list">' + winners.map(function(w){
      return '<div class="res-row"><span class="res-prize">' + esc(w.prize) +
             '</span><span class="res-name">' + esc(w.name) + '</span></div>';
    }).join("") + '</div>' +
    '<div class="res-meta">' + allEntries.length + " " + T[lang].entries + " · " + t + '</div>';
  box.classList.add("on");
}
function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
  });
}

function openStage(){
  if(pollTimer){ clearInterval(pollTimer); pollTimer = null; } // list is committed now; stop pulling fresh rows mid-event
  var r = parseEntries();
  allEntries = r.list.slice();
  pool = r.list.slice();
  prizes = [];
  for(var pi=0; pi<PRIZE_COUNT; pi++){
    var pField = $("prize" + (pi+1));
    prizes.push((pField && pField.value.trim()) || (T[lang].ordinal + " " + (pi+1)));
  }
  winners = [];
  drawIndex = 0;
  drawnAt = null;

  $("stageEvent").textContent = $("eventName").value.trim() ||
    (lang==="ar" ? "السحب الرسمي" : "Official Draw");
  $("prizeLabel").classList.remove("show");
  $("results").classList.remove("on");
  $("reelStrip").innerHTML = "";
  $("reelStrip").style.transition = "none";
  $("reelStrip").style.transform = "translateY(0px)";
  $("setup").style.display = "none";
  $("stage").classList.add("on");
  updateDrawBtn();

  if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function(){});
}

function closeStage(){
  $("stage").classList.remove("on");
  $("setup").style.display = "";
  if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen();
}

/* ============ NAME REEL ============ */
/* Winner is chosen by crypto.getRandomValues over the FULL pool before any
   animation runs. The reel is a presentation device: it never decides the
   winner, it only displays one — the last row in the strip is always the
   real winner, everything scrolling past it is decoration. */
function buildReelRows(poolArr, winnerIdx, totalRows){
  var winnerName = poolArr[winnerIdx];
  var need = totalRows - 1;
  // Excluding the winner from the fill source is fine with a real crowd,
  // but with only 2-3 entrants it leaves just one other name — cycling
  // that alone produces the same name dozens of times in a row, which
  // reads as broken/duplicated rather than as a reel. Below that size,
  // fill from the whole pool (winner included) instead: it's still
  // decoration, the winner was already chosen before this ever renders.
  var fillSource = poolArr.length > 3
    ? poolArr.filter(function(_, i){ return i !== winnerIdx; })
    : poolArr.slice();
  var decoys = [];
  if(fillSource.length >= need){
    decoys = sampleK(fillSource, need);
  } else {
    while(decoys.length < need){
      var lap = shuffle(fillSource.slice());
      // avoid the same name landing back-to-back at the seam between laps
      if(decoys.length && lap.length > 1 && lap[0] === decoys[decoys.length-1]){
        var tmp = lap[0]; lap[0] = lap[1]; lap[1] = tmp;
      }
      decoys = decoys.concat(lap);
    }
    decoys.length = need;
  }
  decoys.push(winnerName); // last row is always the real winner
  return decoys;
}

function renderReelRows(names){
  var strip = $("reelStrip");
  strip.innerHTML = names.map(function(name, i){
    return '<div class="reelRow' + (i === names.length-1 ? ' winnerRow' : '') + '">' + esc(name) + '</div>';
  }).join("");
  var rows = strip.querySelectorAll(".reelRow");
  for(var i=0;i<rows.length;i++){
    if(rows[i].scrollWidth > rows[i].clientWidth) rows[i].classList.add("long");
  }
}

function spinReel(rowCount, duration, onDone){
  var strip = $("reelStrip");
  var rowEl = strip.querySelector(".reelRow");
  var rowH = rowEl.getBoundingClientRect().height;
  var viewportH = $("reelViewport").getBoundingClientRect().height;
  var finalY = viewportH/2 - rowH/2 - (rowCount-1)*rowH;

  strip.style.transition = "none";
  strip.style.transform = "translateY(0px)";
  void strip.offsetHeight; // force reflow so the reset above actually commits

  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduce){
    strip.style.transform = "translateY(" + finalY + "px)";
    onDone();
    return;
  }

  strip.style.transition = "transform " + (duration/1000) + "s cubic-bezier(.15,.8,.2,1)";
  requestAnimationFrame(function(){
    strip.style.transform = "translateY(" + finalY + "px)";
  });

  function onEnd(e){
    if(e.target !== strip || e.propertyName !== "transform") return;
    strip.removeEventListener("transitionend", onEnd);
    onDone();
  }
  strip.addEventListener("transitionend", onEnd);
}

/* ---------- the draw ---------- */
function runDraw(){
  if(busy || drawIndex >= prizes.length || pool.length === 0) return;
  busy = true;
  updateDrawBtn();

  // Winner chosen NOW, before any animation. The reel only presents this result.
  var pick = randInt(pool.length);
  var winnerName = pool[pick];
  var prizeName = prizes[drawIndex] || (T[lang].ordinal + " " + (drawIndex+1));

  var rowNames = buildReelRows(pool, pick, REEL_ROWS);
  renderReelRows(rowNames);

  var pl = $("prizeLabel");
  pl.textContent = prizeName;
  pl.classList.add("show");
  $("results").classList.remove("on");

  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var DUR = reduce ? 1 : 5000;

  spinReel(rowNames.length, DUR, function(){
    var winnerRow = $("reelStrip").querySelector(".winnerRow");
    if(winnerRow) winnerRow.classList.add("settled");

    pool.splice(pick,1);
    winners.push({prize:prizeName, name:winnerName});
    drawIndex++;
    if(!drawnAt) drawnAt = new Date();

    busy = false;
    updateDrawBtn();
    renderResults();
  });
}

/* ---------- CSV drop zone wiring ---------- */
var dz = $("dropzone");
dz.addEventListener("click", function(){ $("fileInput").click(); });
dz.addEventListener("keydown", function(e){ if(e.key==="Enter" || e.key===" "){ e.preventDefault(); $("fileInput").click(); } });
dz.addEventListener("dragover", function(e){ e.preventDefault(); dz.classList.add("drag"); });
dz.addEventListener("dragleave", function(){ dz.classList.remove("drag"); });
dz.addEventListener("drop", function(e){
  e.preventDefault(); dz.classList.remove("drag");
  if(e.dataTransfer.files && e.dataTransfer.files[0]) ingestFile(e.dataTransfer.files[0]);
});
$("pickFile").addEventListener("click", function(e){ e.stopPropagation(); $("fileInput").click(); });
$("fileInput").addEventListener("change", function(){
  if(this.files && this.files[0]) ingestFile(this.files[0]);
  this.value = "";
});

/* ---------- wiring ---------- */
$("entrants").addEventListener("input", refresh);
$("dedupe").addEventListener("change", refresh);
$("tabSheet").addEventListener("click", function(){ setSource("sheet"); });
$("tabPaste").addEventListener("click", function(){ setSource("paste"); });
$("connectBtn").addEventListener("click", connectSheet);
$("sheetUrl").addEventListener("keydown", function(e){ if(e.key === "Enter") connectSheet(); });
$("hasHeader").addEventListener("change", function(){ if(srcMode === "sheet") pullSheet(false); });
$("startDraw").addEventListener("click", openStage);
$("drawBtn").addEventListener("click", runDraw);
$("btnAr").addEventListener("click", function(){ setLang("ar"); });
$("btnEn").addEventListener("click", function(){ setLang("en"); });

document.addEventListener("keydown", function(e){
  if(!$("stage").classList.contains("on")) return;
  if(e.code === "Space" || e.code === "Enter"){
    if(document.activeElement && document.activeElement.tagName === "BUTTON") return;
    e.preventDefault(); runDraw();
  }
});

document.addEventListener("fullscreenchange", function(){
  if(!document.fullscreenElement && $("stage").classList.contains("on")) closeStage();
});

renderPrizeFields();
$("helpsteps").textContent = T[lang].help;
refresh();
connectSheet(); // Sheet tab is the default source — connect immediately, no click needed
})();
</script>
